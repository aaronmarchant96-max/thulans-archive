<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%" style="background-color: #0e1013; font-family: 'IBM Plex Mono', 'Courier New', monospace;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="60%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>

    <linearGradient id="rockGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#181c22" />
      <stop offset="25%" stop-color="#232931" />
      <stop offset="50%" stop-color="#1f242b" />
      <stop offset="75%" stop-color="#272e38" />
      <stop offset="100%" stop-color="#181c22" />
    </linearGradient>

    <linearGradient id="magmaGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b81d05" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="spireGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="foundryOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="timberOlive" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f6212" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#4d7c0f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3f6212" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="deepHearthTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#115e59" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="voidDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050608" stop-opacity="0.95" />
    </linearGradient>

    <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>

    <pattern id="diagonalHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff4444" stroke-width="1" stroke-opacity="0.25" />
    </pattern>

    <pattern id="abandonedHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#000000" stroke-width="3" stroke-opacity="0.45" />
    </pattern>

    <!-- Marker Styles -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1600" height="1200" fill="url(#skyGrad)" />
  <rect width="1600" height="1200" fill="url(#blueprintGrid)" />

  <!-- Mountain Silhouettes (Exterior Flanks) -->
  <!-- Outer massif body -->
  <polygon points="800,100 1350,1100 250,1100" fill="url(#rockGrad)" stroke="#38434f" stroke-width="2" />
  
  <!-- Outer Crags & Buttresses -->
  <path d="M 800,100 L 950,380 L 1150,700 L 1350,1100 L 250,1100 L 450,700 L 650,380 Z" fill="#1b2027" stroke="#4b5563" stroke-width="1.5" />
  
  <!-- Interior Cutaway Chasm (The Great Void / Volcanic Rift) -->
  <!-- Left side interior wall: 400 to 760; Right side: 840 to 1200 -->
  <path d="M 760,180 L 760,1020 L 840,1020 L 840,180 Z" fill="#090a0d" stroke="#c49a45" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
  <text x="800" y="550" fill="#c49a45" font-size="11" letter-spacing="4" text-anchor="middle" transform="rotate(-90 800 550)" opacity="0.6">THE VOLCANIC SHEAR (CENTRAL VENT)</text>

  <!-- Magma Chamber Intrusion (Bottom Core) -->
  <path d="M 500,1150 Q 800,920 1100,1150 Z" fill="url(#magmaGrad)" />
  <path d="M 680,1100 Q 800,960 920,1100 Z" fill="#ffedd5" opacity="0.15" filter="url(#glow)" />
  <path d="M 520,1120 Q 800,940 1080,1120" stroke="#f97316" stroke-width="2" fill="none" stroke-dasharray="6,4" />
  
  <!-- Encroachment Clock Banner -->
  <rect x="620" y="1030" width="360" height="28" rx="4" fill="#1c0f0a" stroke="#ea580c" stroke-width="1.5" />
  <text x="800" y="1049" fill="#fdba74" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1.5">⚠ RISING MAGMA FRONT (11–28 YR BREACH)</text>

  <!-- ==================== STRATUM 1: THE SUMMIT & SPIRE ==================== -->
  <!-- Elevation +3,200m to +4,500m (Y: 120 to 300) -->
  <rect x="680" y="140" width="240" height="150" fill="#182230" stroke="#93c5fd" stroke-width="1.5" opacity="0.9" />
  
  <!-- Exodus Ark Docks (Gantry Bayside) -->
  <rect x="700" y="160" width="90" height="40" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="745" y="184" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">ARK I–III</text>
  
  <rect x="810" y="160" width="90" height="40" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="855" y="184" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">ARK IV–VI</text>

  <text x="800" y="152" fill="#bae6fd" font-size="9" text-anchor="middle" letter-spacing="2">SUMMIT GANTRY DOCKS (CAPACITY: 600,000)</text>

  <!-- Tier Nine Council Balcony & Allocation Ministry -->
  <rect x="710" y="215" width="180" height="65" fill="#1e293b" stroke="url(#spireGold)" stroke-width="1.5" />
  <circle cx="730" cy="235" r="4" fill="#fbbf24" />
  <text x="745" y="239" fill="#fef08a" font-size="11" font-weight="bold">TIER NINE BALCONY</text>
  <text x="745" y="254" fill="#cbd5e1" font-size="9">Theodemir’s Continuity Office</text>
  <text x="745" y="268" fill="#94a3b8" font-size="8.5">Ministry of Allocation &amp; Registry Archives</text>

  <!-- Filtered Air Intake Flues -->
  <path d="M 680,180 L 590,140 M 920,180 L 1010,140" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
  <text x="560" y="135" fill="#7dd3fc" font-size="8.5" text-anchor="end">Clean Air Intake Flue</text>
  <text x="1040" y="135" fill="#7dd3fc" font-size="8.5" text-anchor="start">High Atmospheric Portals</text>

  <!-- Stratum 1 Divider Line -->
  <line x1="450" y1="300" x2="1150" y2="300" stroke="#475569" stroke-width="1" stroke-dasharray="5,5" />
  <text x="440" y="295" fill="#94a3b8" font-size="10" text-anchor="end">TIER 1–2 // +3,200m</text>

  <!-- ==================== STRATUM 2: FOUNDRIES & HEAVY WORKS ==================== -->
  <!-- Elevation +1,800m to +3,200m (Y: 300 to 520) -->
  <!-- Left Wing: Blast Furnaces & Rolling Mills -->
  <rect x="470" y="320" width="270" height="180" fill="url(#foundryOrange)" stroke="#f97316" stroke-width="1.5" />
  <text x="605" y="345" fill="#ffedd5" font-size="12" font-weight="bold" text-anchor="middle">FOUNDRIES &amp; HEAVY WORKS</text>
  
  <rect x="490" y="365" width="130" height="60" fill="#1c1917" stroke="#fb923c" stroke-width="1" />
  <text x="555" y="388" fill="#fdba74" font-size="10" font-weight="bold" text-anchor="middle">BLAST FURNACES</text>
  <text x="555" y="405" fill="#a8a29e" font-size="8.5" text-anchor="middle">Coke &amp; Sinter Lines</text>

  <!-- Foundry Bay Nine -->
  <rect x="630" y="365" width="95" height="60" fill="#292524" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="645" cy="385" r="3.5" fill="#f59e0b" />
  <text x="655" y="388" fill="#fef3c7" font-size="9.5" font-weight="bold">BAY NINE</text>
  <text x="677" y="404" fill="#d6d3d1" font-size="8" text-anchor="middle">Scrap Skips &amp;</text>
  <text x="677" y="415" fill="#d6d3d1" font-size="8" text-anchor="middle">Bronze Lathes</text>

  <!-- Right Wing: The Great North Aqueduct & Water Grid -->
  <rect x="860" y="320" width="270" height="180" fill="#0c4a6e" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.5" />
  <text x="995" y="345" fill="#e0f2fe" font-size="12" font-weight="bold" text-anchor="middle">GREAT NORTH AQUEDUCT</text>
  
  <!-- 30-Mile Intake Flue Pipe -->
  <rect x="880" y="370" width="230" height="35" rx="3" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
  <line x1="880" y1="387" x2="1110" y2="387" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="10,5" />
  <text x="995" y="392" fill="#bae6fd" font-size="9" font-weight="bold" text-anchor="middle">30-MILE INDUSTRIAL INTAKE FLUE</text>
  <text x="995" y="430" fill="#7dd3fc" font-size="9" text-anchor="middle">Pressurized Sump Arteries (Feeds 4.2M Population)</text>

  <!-- Stratum 2 Divider Line -->
  <line x1="380" y1="520" x2="1220" y2="520" stroke="#475569" stroke-width="1" stroke-dasharray="5,5" />
  <text x="370" y="515" fill="#94a3b8" font-size="10" text-anchor="end">TIER 3–4 // +1,800m</text>

  <!-- ==================== STRATUM 3: TIMBER FLUES & MID-LEVELS ==================== -->
  <!-- Elevation +600m to +1,800m (Y: 520 to 740) -->
  <rect x="420" y="540" width="320" height="180" fill="url(#timberOlive)" stroke="#84cc16" stroke-width="1.5" />
  <text x="580" y="565" fill="#ecfccb" font-size="12" font-weight="bold" text-anchor="middle">TIMBER FLUES &amp; LOGGING CAVERNS</text>

  <rect x="440" y="585" width="160" height="65" fill="#142308" stroke="#a3e635" stroke-width="1" />
  <text x="520" y="608" fill="#d9f99d" font-size="10" font-weight="bold" text-anchor="middle">TIMBERMEN GUILD</text>
  <text x="520" y="624" fill="#bef264" font-size="8.5" text-anchor="middle">~40,000 Workers (Fossil Trunks)</text>
  <text x="520" y="638" fill="#a1a1aa" font-size="8" text-anchor="middle">Shoring Debt &amp; Strike Line</text>

  <!-- Haulage Skip Terminals & Cables -->
  <rect x="615" y="585" width="110" height="65" fill="#1c1917" stroke="#ca8a04" stroke-width="1" />
  <text x="670" y="608" fill="#fde047" font-size="9.5" font-weight="bold" text-anchor="middle">HAULAGE SKIPS</text>
  <line x1="630" y1="620" x2="710" y2="635" stroke="#eab308" stroke-width="2" />
  <text x="670" y="642" fill="#a1a1aa" font-size="8" text-anchor="middle">Cable Terminals</text>

  <!-- Right Wing: Agricultural Caverns & Bracket-Fungus -->
  <rect x="860" y="540" width="320" height="180" fill="#14532d" fill-opacity="0.3" stroke="#22c55e" stroke-width="1.5" />
  <text x="1020" y="565" fill="#dcfce7" font-size="12" font-weight="bold" text-anchor="middle">AGRI-VAULTS &amp; FUNGUS BEDS</text>
  
  <rect x="880" y="585" width="140" height="65" fill="#052e16" stroke="#4ade80" stroke-width="1" />
  <text x="950" y="608" fill="#bbf7d0" font-size="10" font-weight="bold" text-anchor="middle">BRACKET FUNGUS</text>
  <text x="950" y="624" fill="#86efac" font-size="8.5" text-anchor="middle">Caloric Ration Beds</text>
  <text x="950" y="638" fill="#a1a1aa" font-size="8" text-anchor="middle">Sawdust &amp; Mash Trays</text>

  <!-- Abandoned Transit Trunks (Welded Shut) -->
  <rect x="1035" y="585" width="130" height="65" fill="url(#abandonedHatch)" stroke="#ef4444" stroke-width="1" />
  <text x="1100" y="612" fill="#fca5a5" font-size="9" font-weight="bold" text-anchor="middle">LIFT TRUNK #4</text>
  <text x="1100" y="630" fill="#f87171" font-size="8" text-anchor="middle">WELDED SHUT</text>

  <!-- Stratum 3 Divider Line -->
  <line x1="320" y1="740" x2="1280" y2="740" stroke="#475569" stroke-width="1" stroke-dasharray="5,5" />
  <text x="310" y="735" fill="#94a3b8" font-size="10" text-anchor="end">TIER 5–6 // +600m</text>

  <!-- ==================== STRATUM 4: LOWER FOUR & THE DEEP HEARTHS ==================== -->
  <!-- Elevation -400m to +600m (Y: 740 to 980) -->
  <rect x="360" y="760" width="400" height="210" fill="url(#deepHearthTeal)" stroke="#14b8a6" stroke-width="2" />
  <text x="560" y="785" fill="#ccfbf1" font-size="13" font-weight="bold" text-anchor="middle">LOWER FOUR // DRIFT SECTORS</text>
  
  <!-- SHAFT 44 (CANON CORE SITE) -->
  <rect x="380" y="805" width="180" height="75" fill="#134e4a" stroke="#2dd4bf" stroke-width="2" filter="url(#glow)" />
  <circle cx="400" cy="825" r="5" fill="#f43f5e" />
  <text x="415" y="830" fill="#ffffff" font-size="11" font-weight="bold">SHAFT 44 (BREACH)</text>
  <text x="415" y="846" fill="#5eead4" font-size="9">Banded Magnetite Ironstone</text>
  <text x="415" y="860" fill="#cbd5e1" font-size="8.5">Varek’s Stand (Roof Collapse)</text>
  <text x="415" y="872" fill="#fdba74" font-size="8">Sanna &amp; Children Rescued</text>

  <!-- DRIFT 14 & KAELEN'S FORGE -->
  <rect x="580" y="805" width="160" height="75" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="600" cy="825" r="4" fill="#fbbf24" />
  <text x="615" y="830" fill="#fef3c7" font-size="10.5" font-weight="bold">DRIFT 14</text>
  <text x="615" y="846" fill="#e2e8f0" font-size="9">Kaelen’s Forge &amp; Smithy</text>
  <text x="615" y="860" fill="#94a3b8" font-size="8.5">Stolen Impeller Pump Rig</text>
  <text x="615" y="872" fill="#6ee7b7" font-size="8">Bram’s Evidence Desk</text>

  <!-- THE NURSERY & SUMP RUNOFF -->
  <rect x="380" y="895" width="180" height="60" fill="#042f2e" stroke="#2dd4bf" stroke-width="1" />
  <text x="470" y="918" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">COMMUNAL NURSERY</text>
  <text x="470" y="934" fill="#e2e8f0" font-size="8.5" text-anchor="middle">Varek’s Salvaged Pump Unit</text>
  <text x="470" y="946" fill="#6ee7b7" font-size="8" text-anchor="middle">Hand-Cranked Drainage (Infants)</text>

  <!-- AZG-HAÍMS & TITHE DESK -->
  <rect x="580" y="895" width="160" height="60" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
  <text x="660" y="918" fill="#e0e7ff" font-size="10" font-weight="bold" text-anchor="middle">AZG-HAÍMS</text>
  <text x="660" y="934" fill="#c7d2fe" font-size="8.5" text-anchor="middle">Wulfila’s Water-Tithe Post</text>
  <text x="660" y="946" fill="#a5b4fc" font-size="8" text-anchor="middle">41 Winters Surrendered</text>

  <!-- Right Wing: Abandoned Ghost Arcology (90% Contraction) -->
  <rect x="840" y="760" width="380" height="210" fill="url(#abandonedHatch)" stroke="#64748b" stroke-width="1.5" />
  <rect x="870" y="810" width="320" height="110" fill="#090a0f" fill-opacity="0.9" stroke="#94a3b8" stroke-width="1" />
  <text x="1030" y="840" fill="#f1f5f9" font-size="12" font-weight="bold" text-anchor="middle">THE DEAD ARCHITECTURE (10:1 RATIO)</text>
  <text x="1030" y="865" fill="#94a3b8" font-size="9.5" text-anchor="middle">Engineered Peak: 42,000,000 Inhabitants</text>
  <text x="1030" y="885" fill="#f87171" font-size="9.5" font-weight="bold" text-anchor="middle">Current Living Population: 4,200,000</text>
  <text x="1030" y="905" fill="#64748b" font-size="8.5" text-anchor="middle">Flooded Galleries • Stripped Vaults • Cold Basalt Silences</text>

  <!-- Stratum 4 Divider Line -->
  <line x1="280" y1="980" x2="1320" y2="980" stroke="#475569" stroke-width="1" stroke-dasharray="5,5" />
  <text x="270" y="975" fill="#94a3b8" font-size="10" text-anchor="end">TIER 7–8 // -400m</text>

  <!-- ==================== VERTICAL & HORIZONTAL AXIS LABELS ==================== -->
  <!-- Left Side: Elevation Scale & Direction -->
  <g transform="translate(60, 400)">
    <!-- Up-Mountain Arrow -->
    <line x1="40" y1="350" x2="40" y2="50" stroke="#c49a45" stroke-width="2.5" />
    <polygon points="40,35 34,55 46,55" fill="#c49a45" />
    <text x="30" y="200" fill="#c49a45" font-size="12" font-weight="bold" letter-spacing="3" text-anchor="middle" transform="rotate(-90 30 200)">UP-MOUNTAIN</text>
    
    <!-- Down-Mountain Arrow -->
    <line x1="40" y1="450" x2="40" y2="750" stroke="#c49a45" stroke-width="2.5" />
    <polygon points="40,765 34,745 46,745" fill="#c49a45" />
    <text x="30" y="600" fill="#c49a45" font-size="12" font-weight="bold" letter-spacing="3" text-anchor="middle" transform="rotate(90 30 600)">DOWN-MOUNTAIN</text>
  </g>

  <!-- Bottom: Rimward <-> Coreward Axis -->
  <g transform="translate(800, 1170)">
    <line x1="-350" y1="0" x2="350" y2="0" stroke="#c49a45" stroke-width="2" />
    <polygon points="-365,0 -345,-5 -345,5" fill="#c49a45" />
    <polygon points="365,0 345,-5 345,5" fill="#c49a45" />
    <text x="-250" y="-8" fill="#c49a45" font-size="11" font-weight="bold" letter-spacing="2">RIMWARD (OUTER FLANKS)</text>
    <text x="0" y="-8" fill="#e2e8f0" font-size="10" text-anchor="middle">|</text>
    <text x="250" y="-8" fill="#c49a45" font-size="11" font-weight="bold" letter-spacing="2" text-anchor="end">COREWARD (VOLCANIC CENTER)</text>
  </g>

  <!-- ==================== ARCHITECTURAL HEADER & CARTOUCHE ==================== -->
  <rect x="50" y="40" width="460" height="100" rx="4" fill="#090b0e" stroke="#c49a45" stroke-width="2" />
  <rect x="55" y="45" width="450" height="90" fill="#12151b" stroke="#334155" stroke-width="1" />
  
  <text x="75" y="75" fill="#fef08a" font-size="15" font-weight="bold" letter-spacing="3">FAÍRGUNI // THE MOUNTAIN</text>
  <text x="75" y="95" fill="#94a3b8" font-size="10" letter-spacing="1.5">CANONICAL ARCOLOGY CROSS-SECTION ELEVATION</text>
  <text x="75" y="115" fill="#64748b" font-size="8.5">POST-CONTRACTION CENSUS: 4,200,000 • SYSTEM SCALE: 1:10</text>
  <text x="75" y="126" fill="#38bdf8" font-size="8">AUTHORITY: RULINGS 004, 030, 034 • THULANS PRODUCTION</text>

  <!-- Legend Box (Top Right) -->
  <rect x="1220" y="40" width="330" height="170" rx="4" fill="#090b0e" stroke="#c49a45" stroke-width="1.5" />
  <rect x="1225" y="45" width="320" height="160" fill="#12151b" stroke="#334155" stroke-width="1" />
  
  <text x="1245" y="70" fill="#fef08a" font-size="11" font-weight="bold" letter-spacing="2">SECTOR STATUS &amp; KEYS</text>
  
  <circle cx="1255" cy="92" r="5" fill="#38bdf8" />
  <text x="1270" y="96" fill="#e2e8f0" font-size="9">Exodus Ark Yards (14.3% Evac)</text>

  <circle cx="1255" cy="112" r="5" fill="#fb923c" />
  <text x="1270" y="116" fill="#e2e8f0" font-size="9">Heavy Blast Furnaces &amp; Foundry Bay 9</text>

  <circle cx="1255" cy="132" r="5" fill="#a3e635" />
  <text x="1270" y="136" fill="#e2e8f0" font-size="9">Timbermen Guild &amp; Fungus Vaults</text>

  <circle cx="1255" cy="152" r="5" fill="#2dd4bf" />
  <text x="1270" y="156" fill="#e2e8f0" font-size="9">Lower Four (Shaft 44, Drift 14, Nursery)</text>

  <circle cx="1255" cy="172" r="5" fill="#f43f5e" />
  <text x="1270" y="176" fill="#e2e8f0" font-size="9">Rising Magma Intrusion Front</text>

  <rect x="1250" y="186" width="10" height="10" fill="url(#abandonedHatch)" stroke="#64748b" stroke-width="0.5" />
  <text x="1270" y="195" fill="#94a3b8" font-size="8.5">Dead Infrastructure (90% Contraction)</text>
</svg>
